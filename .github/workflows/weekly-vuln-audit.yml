name: Weekly vulnerability audit
on:
  schedule:
    - cron: '43 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-vuln-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Audit vulnerabilities
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit all dependencies
        run: npm audit --include=dev --include=optional --include=peer --audit-level=info
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --include=optional --include=peer --audit-level=info
